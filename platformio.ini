[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-n16r8
; Build Arduino on top of ESP-IDF so the USB-host hub timing settings from
; sdkconfig.defaults are compiled into the same firmware as the plugin app.
framework = arduino, espidf
board_build.partitions = partitions.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.plugin.defaults"
extra_scripts = pre:scripts/embed_web_ui.py
lib_deps =
  h2zero/NimBLE-Arduino@2.5.2

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

[env:usb-hub-timing]
platform = espressif32
board = esp32-s3-n16r8
framework = espidf
board_build.cmake_extra_args = -DUSB_HUB_DIAGNOSTIC=1
monitor_speed = 115200
upload_speed = 460800
