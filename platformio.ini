[platformio]
default_envs = esp32-s3-n16r8

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<gp5_protocol.cpp> +<gp5_models.cpp> +<core/read_model.cpp> +<core/switching.cpp> +<core/connection.cpp> +<core/usb_midi_decoder.cpp> +<core/session_output.cpp> +<core/application.cpp> +<devices/pocket_master/protocol.cpp> +<devices/pocket_master/plugin.cpp> +<devices/gp5/readback.cpp> +<devices/gp5/plugin.cpp> +<devices/registry.cpp> +<platform/ui_ble_frames.cpp> +<ui/live_ingress.cpp> +<ui/live_json.cpp>
build_flags = -I include -I src -Wall -Wextra -Werror
test_filter = test_native_*

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-n16r8
; Build Arduino on top of ESP-IDF so the USB-host hub timing settings from
; sdkconfig.defaults are compiled into the same firmware as the plugin app.
framework = arduino, espidf
board_build.partitions = partitions.csv
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.plugin.defaults"
extra_scripts = pre:scripts/embed_web_ui.py
lib_deps =
  h2zero/NimBLE-Arduino@2.5.2

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

[env:stompbridge-next-input]
extends = env:esp32-s3-n16r8
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.plugin.defaults" -DSTOMPBRIDGE_NEXT_INPUT=1
extra_scripts =
lib_deps =

[env:stompbridge-next-usb]
extends = env:esp32-s3-n16r8
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.plugin.defaults" -DSTOMPBRIDGE_NEXT_USB=1
extra_scripts =
lib_deps =

[env:stompbridge-next-ble-ui]
extends = env:esp32-s3-n16r8
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.plugin.defaults" -DSTOMPBRIDGE_BLE_UI=1
extra_scripts =
lib_deps =
  h2zero/NimBLE-Arduino@2.5.2

[env:stompbridge-next-ui-dev]
extends = env:stompbridge-next-ble-ui
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.plugin.defaults" -DSTOMPBRIDGE_UI_SERIAL=1

[env:usb-hub-timing]
platform = espressif32
board = esp32-s3-n16r8
framework = espidf
board_build.cmake_extra_args = -DUSB_HUB_DIAGNOSTIC=1
monitor_speed = 115200
upload_speed = 460800
