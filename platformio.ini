[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-n16r8
framework = arduino
build_src_filter =
  +<*>
  -<usb_hub_diagnostic/>
extra_scripts = pre:scripts/embed_web_ui.py
lib_deps =
  h2zero/NimBLE-Arduino@2.5.2

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

[env:usb-hub-timing]
platform = espressif32
board = esp32-s3-n16r8
framework = espidf
monitor_speed = 115200
upload_speed = 460800
