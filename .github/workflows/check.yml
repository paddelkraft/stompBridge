name: Checks

on:
  push:
  pull_request:

jobs:
  native-and-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install development tools
        run: ./scripts/setup-dev
      - name: Run protocol, host, native, and firmware checks
        run: ./scripts/check
